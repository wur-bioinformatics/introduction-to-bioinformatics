name: Deploy online book

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag against package.json
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Check the tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main; refusing to publish it."
            exit 1
          fi

      - name: Report published version
        run: echo "Publishing **$GITHUB_REF_NAME**." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: Introduction to Bioinformatics
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HTML
        run: npx myst build --html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5

  pdf:
    name: Build PDF
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned rather than "latest": typst is a renderer, and an unpinned bump
      # would change the book's layout without any change to the book.
      - name: Install typst
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5.2.0
        with:
          typst-version: "0.15.1"

      - name: Build PDF
        run: npm run build:pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-pdf
          path: exports/BIF20306book.pdf
          if-no-files-found: error

  release:
    name: Release
    # The PDF is a release asset, and the site links to it, so a release is only
    # cut once both the site is live and the PDF actually built.
    needs: [deploy, pdf]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v7
        with:
          name: book-pdf
          path: exports

      - name: Create GitHub release for the tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: exports/BIF20306book.pdf
