name: Build check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build book with MyST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check package.json against the latest release
        if: github.event_name == 'pull_request'
        run: scripts/check-version.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HTML
        run: npx myst build --html

      - name: Upload site preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-preview-pr-${{ github.event.pull_request.number }}
          path: _build/html
          retention-days: 7
