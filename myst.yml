  github: https://github.com/wur-bioinformatics/introduction-to-bioinformatics
  authors:
    - name: Dick de Ridder
      id: dickderidder
      orcid: 0000-0002-4944-4310
      affiliations: WUR Bioinformatics
    - name: Anne Kupczok
      id: annekupczok
      orcid: 0000-0001-5237-1899
      affiliations: WUR Bioinformatics
    - name: Rens Holmer
      id: rensholmer
      orcid: 0000-0002-1080-1763
      github: holmrenser
      affiliations: WUR Bioinformatics
      corresponding: true
      email: introduction@bioinformatics.nl
    - name: Freek Bakker
      id: freekbakker
      orcid: 0000-0003-0227-6687
      affiliations: WUR Biosystematics
    - name: Justin van der Hooft
      id: justinvanderhooft
      orcid: 0000-0002-9340-5511
      affiliations: WUR Bioinformatics
    - name: Judith Risse
      id: judithrisse
      orcid: 0000-0001-9072-8633
      affiliations: WUR Bioinformatics
    - name: Jorge Navarro
      id: jorgenavarro
      orcid: 0000-0003-2992-1607
      affiliations: WUR Bioinformatics
    - name: Tomer Sardjoe
      id: tomersardjoe
      orcid: 0009-0006-5393-0908
      github: Tomersardjoe
      affiliations: WUR Bioinformatics
    - name: Mate Zoltai
      id: matezoltai
      affiliations: WUR Bioinformatics 
  affiliations:
   - id: wurbif
     institution: Wageningen University & Reseach
     department: Bioinformatics
   - id: wurbis
     institution: Wageningen University & Reseach
     department: Biosystematics
  bibliography:
    - references.bib
  # The typeset PDF is attached to each GitHub release rather than served from
  # the site: it is ~65 MB, and release assets do not count against the Pages
  # bandwidth allowance. "releases/latest/download" always resolves to the newest
  # release, which is also what the deployed site is built from.
  downloads:
    - url: https://github.com/wur-bioinformatics/introduction-to-bioinformatics/releases/latest/download/BIF20306book.pdf
      title: Download the whole book as a PDF
      filename: BIF20306book.pdf
      static: false
  exports:
    # Building this needs the typst CLI: `brew install typst`, then
    # `npm run build:pdf`. Output is written next to the .typ source so the
    # generated typst can be inspected when something renders oddly.
    - id: book
      format: typst
      template: templates/bif-book
      output: exports/BIF20306book.typ
      # The titles drop the "1. ", "2. " prefixes the web version carries: typst
      # numbers the chapters itself, and the introduction is front matter rather
      # than chapter 1. level: 1 makes each title a chapter heading.
      articles:
       - file: intro.md
         level: 1
       - file: chapter1.md
         level: 1
         title: Genes, Proteins, Databases, Genome annotation
       - file: chapter2.md
         level: 1
         title: Alignment, sequence search, and primer design
       - file: chapter3.md
         level: 1
         title: Phylogenetics and tree reconstruction
       - file: chapter4.md
         level: 1
         title: Protein structure prediction
       - file: chapter5.md
         level: 1
         title: Omics data analysis
      options:
        papersize: a4
        fontsize: 10
        fontstyle: Libertinus Serif
        linespacing: 0.65
        justification: true
        margin_top: 2.2
        margin_bottom: 2.2
        margin_left: 15
        margin_right: 15
        colortheme: rgb("#34862b")
        colorheadings: rgb("#1a1a1a")
        show_pagenumber: true
        show_ToC: true
        ToC_depth: 2
        cover: BIF_logo.png
        cover_width: 9
        coverposition: 3
        institution: Wageningen University & Research
        book_url: https://introduction.bioinformatics.nl
        book_doi: 10.5281/zenodo.16920734
        license_text: This work is licensed under CC BY-NC 4.0.
  toc:
    - file: intro.md
    - file: chapter1.md
    - file: chapter2.md
    - file: chapter3.md
    - file: chapter4.md
    - file: chapter5.md
  plugins:
    - plugins/table-plugin.mjs
    - plugins/version-plugin.mjs
    - plugins/print-plugin.mjs
site:
  github: http://github.com/wur-bioinformatics/introduction-to-bioinformatics
  template: book-theme
  options:
    logo: BIF_logo.png
    style: style/custom.css
    logo_text: Introduction to Bioinformatics
    analytics_plausible: wur-bioinformatics.github.io/introduction-to-bioinformatics
  parts:
    primary_sidebar_footer: components/primary-sidebar-footer.md
